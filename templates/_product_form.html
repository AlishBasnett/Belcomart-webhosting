<label>Product name<input name="name" value="{{ product.name if product else '' }}" required></label>
<label>Brand<input name="brand" value="{{ product.brand if product else '' }}"></label>
<label>Description<textarea name="description">{{ product.description if product else '' }}</textarea></label>
<div class="form-row">
    <label>Price<input type="number" step="0.01" name="price" value="{{ product.price if product else '' }}" required></label>
    <label>Sale price<input type="number" step="0.01" name="sale_price" value="{{ product.sale_price if product else '' }}"></label>
</div>
<div class="form-row">
    <label>Stock quantity<input type="number" name="stock_quantity" value="{{ product.stock_quantity if product else 0 }}"></label>
    <label>Unit<input name="unit" value="{{ product.unit if product else 'each' }}"></label>
</div>
<div class="form-row">
    <label>Origin country<input name="origin_country" value="{{ product.origin_country if product else '' }}"></label>
    <label>Status
        <select name="status">
            {% for status in statuses %}
                <option value="{{ status }}" {% if product and product.status == status %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
        </select>
    </label>
</div>
<label>Category
    <select name="category_id">
        <option value="">No category</option>
        {% for category in categories %}
            <option value="{{ category.id }}" {% if product and product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
        {% endfor %}
    </select>
</label>
<label>Image path or URL<input name="image_path" value="{{ product.image_path if product else '' }}"></label>
<label>Upload product image<input type="file" name="image_file" accept="image/*"></label>
<label class="checkline"><input type="checkbox" name="is_featured" {% if product and product.is_featured %}checked{% endif %}> Featured product</label>
